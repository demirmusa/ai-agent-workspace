name: aiws-control
services:
  control:
    image: aiws-control:local
    build:
      context: ../../..
      dockerfile: src/control-server/docker/Dockerfile.control
      target: server
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIWS_CONTROL_PORT:-4317}:4317"
    environment:
      AIWS_CONTROL_HOST: 0.0.0.0
      AIWS_CONTROL_PORT: 4317
      AIWS_CONTROL_DATA_DIR: /data
      AIWS_CONTROL_TOKEN: "${AIWS_CONTROL_TOKEN:?Set AIWS_CONTROL_TOKEN in your shell or .env}"
      AIWS_GITHUB_TOKEN: "${AIWS_GITHUB_TOKEN:-}"
      AIWS_CONTROL_AGENT_URL: "${AIWS_CONTROL_AGENT_URL:-http://control:4317}"
      AIWS_CONTROL_DOCKER_NETWORK: aiws-control_default
      AIWS_CONTROL_EXECUTION_MODE: docker
      AIWS_CONTROL_DOCKER_IMAGE: aiws-control-worker:local
      AIWS_CONTROL_SKILLS_VOLUME: "${AIWS_CONTROL_SKILLS_VOLUME:-aiws-control_control-data}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENCODE_API_KEY: "${OPENCODE_API_KEY:-}"
      COPILOT_GITHUB_TOKEN: "${COPILOT_GITHUB_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - control-data:/data
      # The path inside the API container MUST match its Docker-host absolute path.
      # Set AIWS_WORKSPACE_ROOT to a dedicated projects directory, e.g. /srv/projects.
      - "${AIWS_WORKSPACE_ROOT:?Set AIWS_WORKSPACE_ROOT to an absolute projects directory}:${AIWS_WORKSPACE_ROOT}"
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # The health endpoint is cheap; /api/state would serialize the whole control state every 30 seconds.
      test: ["CMD", "node", "--eval", "fetch('http://127.0.0.1:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker-image:
    image: aiws-control-worker:local
    build:
      context: ../../..
      dockerfile: src/control-server/docker/Dockerfile.control
      target: worker
    profiles: ["build"]
    entrypoint: ["node", "--version"]
volumes:
  control-data:
    name: "${AIWS_CONTROL_SKILLS_VOLUME:-aiws-control_control-data}"
